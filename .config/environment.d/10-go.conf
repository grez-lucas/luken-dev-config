# Read by the systemd user manager, so apps launched from the desktop (nvim
# from the app grid rather than a terminal) inherit this. Those launches never
# source ~/.zshenv or ~/.zshrc, which is why this duplicates the Go block in
# ~/.zshenv. Keep the two in step.
#
# Without it, a GUI-launched nvim has no `go` on PATH and gopls, Mason and
# golangci-lint all fail to start.
#
# Only ${VAR} expansion is supported here; no command substitution, no globs.
# Takes effect on next login.
#
# PATH is deliberately NOT set here. systemd 255 filters PATH out of
# environment.d: both `PATH=...:${PATH}` and a literal value are dropped, and
# the generator emits the manager's default regardless. Verified by running
#   /usr/lib/systemd/user-environment-generators/30-systemd-environment-d-generator
# GOPATH and GOTOOLCHAIN below do come through. The PATH half lives in
# ~/.profile, which the graphical session does source.

GOPATH=${HOME}/go

# Never let `go` download a second toolchain behind our back.
GOTOOLCHAIN=local
