

# Opaque: at 0.9 the desktop bled through and dropped the effective
# contrast of already-dim syntax groups (comments worst).
background_opacity 1.0
foreground            #D8DEE9
background            #2E3440
selection_foreground  #000000
selection_background  #FFFACD
url_color             #0087BD
cursor                #81A1C1

# black
color0   #3B4252
color8   #4C566A

# red
color1   #BF616A
color9   #BF616A

# green
color2   #A3BE8C
color10  #A3BE8C

# yellow
color3   #EBCB8B
color11  #EBCB8B

# blue
color4  #81A1C1
color12 #81A1C1

# magenta
color5   #B48EAD
color13  #B48EAD

# cyan
color6   #88C0D0
color14  #8FBCBB

# white
color7   #E5E9F0
color15  #ECEFF4

#----------------------------

# fonts
font_size 11.5
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
disable_ligatures never

# Thicken stems for light-on-dark rendering; JetBrains Mono renders thin
# and smeary at this DPI without it.
text_composition_strategy 1.4 25
# Extra leading makes comment lines scannable.
modify_font cell_height 108%

# padding and window
window_margin_width 0
window_padding_width 12
remember_window_size yes
hide_window_decorations no
wayland_titlebar_color system
draw_minimal_borders yes
window_border_width 0


# Tab bar styling
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_margin_width 0.0
tab_bar_margin_height 0.0 0.0

# Mouse and URL styling
mouse_hide_wait 3.0
url_style double
clipboard_control write-clipboard write-primary no-append read-clipboard read-primary

# Cursor customization
cursor_shape beam
cursor_blink_interval 0.5
